<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OX 퀴즈</title><style>
body{font-family:-apple-system,sans-serif;background:#f4f6fb;color:#172033;margin:0}main{max-width:720px;margin:auto;padding:16px}.card{background:white;border:1px solid #ddd;border-radius:16px;padding:16px;margin:12px 0}button{padding:12px;border:0;border-radius:10px;background:#2459d3;color:white;font-weight:bold;margin:3px}button.secondary{background:#e8edf5;color:#172033}input,textarea,select{box-sizing:border-box;width:100%;padding:12px;margin:5px 0 12px;border:1px solid #ccd3df;border-radius:8px;font:inherit}.hidden{display:none!important}.correct{border-left:4px solid #19a05a;padding-left:10px}.wrong{border-left:4px solid #d22;padding-left:10px}.muted{color:#667085}.row{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><main>
<div class="card"><h1>OX 퀴즈</h1><p>비회원도 풀 수 있어요. 아이디로 가입하면 기록이 저장됩니다.</p><button id="navQuiz">퀴즈</button><button class="secondary" id="navHistory">내 기록</button><button class="secondary" id="navAuth">아이디 로그인/가입</button><button class="secondary hidden" id="navAdmin">문제 관리</button><button class="secondary hidden" id="logout">로그아웃</button><p id="who" class="muted">비회원</p></div>
<section id="auth" class="card hidden"><h2>아이디 로그인/가입</h2><label>아이디 (영문·숫자·밑줄 3~24자)</label><input id="username" autocomplete="username"><label>비밀번호 (6자 이상)</label><input id="password" type="password" autocomplete="current-password"><button id="signup">회원가입</button><button class="secondary" id="login">로그인</button><p id="authMsg"></p></section>
<section id="quiz" class="card"><h2>문제</h2><p id="intro">불러오는 중…</p><div id="qs"></div><button id="submit">답안 제출</button><div id="result"></div></section>
<section id="history" class="card hidden"><h2>내 기록</h2><p id="histIntro"></p><div id="hist"></div></section>
<section id="admin" class="card hidden"><h2>문제 관리</h2><input id="editId" type="hidden"><label>문제</label><textarea id="qText"></textarea><label>정답</label><select id="qAnswer"><option value="true">O</option><option value="false">X</option></select><label>해설</label><textarea id="qExpl"></textarea><label><input id="pub" type="checkbox" checked style="width:auto"> 공개</label><button id="save">저장</button><button class="secondary" id="clear">새 문제</button><div id="adminList"></div></section><p id="message"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL="YOUR_SUPABASE_PROJECT_URL",KEY="YOUR_SUPABASE_ANON_KEY",okConfig=!URL.startsWith("YOUR_")&&!KEY.startsWith("YOUR_"),$=x=>document.getElementById(x);let sb,user=null,admin=false,qs=[],guest="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const email=u=>u.toLowerCase()+"@accounts.oxquiz.invalid";const valid=u=>/^[a-zA-Z0-9_]{3,24}$/.test(u);
function show(id){["auth","quiz","history","admin"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
async function refresh(){admin=false;if(user){let {data}=await sb.from("profiles").select("role,username").eq("id",user.id).maybeSingle();admin=data?.role==="admin";$("who").textContent="로그인: "+(data?.username||user.user_metadata?.username||"회원")+(admin?" (관리자)":"")}else $("who").textContent="비회원";$("navAdmin").classList.toggle("hidden",!admin);$("logout").classList.toggle("hidden",!user)}
async function loadQs(){let {data,error}=await sb.from("questions").select("id,question").eq("published",true).order("id");if(error){$("intro").textContent=error.message;return}qs=data||[];$("intro").textContent=qs.length?qs.length+"문제":"공개된 문제가 없습니다."; $("qs").innerHTML=qs.map((q,i)=>`<div class="card"><p>${i+1}. ${esc(q.question)}</p><label><input type="radio" name="q${q.id}" value="true" style="width:auto"> O</label>　<label><input type="radio" name="q${q.id}" value="false" style="width:auto"> X</label></div>`).join("");$("result").innerHTML=""}
async function init(){if(!okConfig){$("message").textContent="index.html에서 Supabase URL과 anon key를 설정하세요.";return}sb=window.supabase.createClient(URL,KEY);guest=localStorage.getItem("ox_guest")||crypto.randomUUID().replaceAll("-","");localStorage.setItem("ox_guest",guest);let {data:{session}}=await sb.auth.getSession();user=session?.user||null;sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;setTimeout(refresh,0)});await refresh();await loadQs()}
$("navQuiz").onclick=()=>show("quiz");$("navAuth").onclick=()=>show("auth");$("navHistory").onclick=async()=>{show("history");await history()};$("navAdmin").onclick=async()=>{if(admin){show("admin");await adminLoad()}};$("logout").onclick=async()=>{await sb.auth.signOut();show("quiz")};
$("signup").onclick=async()=>{let u=$("username").value.trim(),p=$("password").value;if(!valid(u))return $("authMsg").textContent="아이디는 영문/숫자/밑줄 3~24자입니다.";if(p.length<6)return $("authMsg").textContent="비밀번호는 6자 이상이어야 합니다.";let {error}=await sb.auth.signUp({email:email(u),password:p,options:{data:{username:u}}});$("authMsg").textContent=error?"가입 실패: "+error.message:"가입 요청 완료. Supabase에서 이메일 확인을 꺼야 바로 로그인됩니다."};
$("login").onclick=async()=>{let u=$("username").value.trim(),p=$("password").value;if(!valid(u))return $("authMsg").textContent="아이디 형식을 확인해 주세요.";let {error}=await sb.auth.signInWithPassword({email:email(u),password:p});$("authMsg").textContent=error?"로그인 실패: 아이디/비밀번호를 확인하세요.":"로그인 성공";if(!error)show("quiz")};
$("submit").onclick=async()=>{let a=[];for(let q of qs){let x=document.querySelector(`input[name="q${q.id}"]:checked`);if(!x)return $("message").textContent="모든 문제에 답해 주세요.";a.push({question_id:q.id,answer:x.value==="true"})}$("submit").disabled=true;let {data,error}=await sb.rpc("submit_quiz",{p_answers:a,p_guest_token:user?null:guest});$("submit").disabled=false;if(error)return $("message").textContent=error.message;$("result").innerHTML=`<h3>점수 ${data.score}/${data.total}</h3>`+data.results.map((r,i)=>`<div class="${r.is_correct?"correct":"wrong"}"><p>${i+1}. ${esc(qs.find(q=>q.id===r.question_id)?.question)} — ${r.is_correct?"정답":"오답"}</p><p>내 답 ${r.chosen_answer?"O":"X"} / 정답 ${r.correct_answer?"O":"X"}</p><p>해설: ${esc(r.explanation)}</p></div>`).join("");$("message").textContent=user?"회원 기록이 저장됐습니다.":"비회원 기록은 이 기기에만 남으며 계정 기록과 연결되지 않습니다."};
async function history(){if(!user){$("histIntro").textContent="기록을 보려면 아이디로 로그인하세요.";return $("hist").innerHTML=""}let {data,error}=await sb.from("attempts").select("id,score,total,completed_at,attempt_answers(question_id,chosen_answer,is_correct,questions(question))").eq("user_id",user.id).order("completed_at",{ascending:false}).limit(100);if(error)return $("histIntro").textContent=error.message;$("histIntro").textContent=data.length+"회 풀이";$("hist").innerHTML=data.map(a=>`<div class="card"><b>${new Date(a.completed_at).toLocaleString("ko-KR")}</b><p>${a.score}/${a.total}</p><details><summary>문제별 기록</summary>${(a.attempt_answers||[]).map(x=>`<p>${esc(x.questions?.question)} / ${x.chosen_answer?"O":"X"} / ${x.is_correct?"정답":"오답"}</p>`).join("")}</details></div>`).join("")}
function clearQ(){$("editId").value="";$("qText").value="";$("qAnswer").value="true";$("qExpl").value="";$("pub").checked=true}$("clear").onclick=clearQ;
$("save").onclick=async()=>{if(!admin)return;let id=$("editId").value,p={question:$("qText").value.trim(),answer:$("qAnswer").value==="true",explanation:$("qExpl").value.trim(),published:$("pub").checked};if(!p.question)return $("message").textContent="문제를 입력하세요.";let r=id?await sb.from("questions").update(p).eq("id",id):await sb.from("questions").insert(p);if(r.error)return $("message").textContent=r.error.message;clearQ();await loadQs();await adminLoad()};
async function adminLoad(){if(!admin)return;let {data,error}=await sb.from("questions").select("*").order("id");if(error)return $("adminList").textContent=error.message;$("adminList").innerHTML=data.map(q=>`<div class="card"><b>${esc(q.question)}</b><p>${q.answer?"정답 O":"정답 X"} · ${q.published?"공개":"비공개"}</p><p>${esc(q.explanation)}</p><button class="secondary" data-edit="${q.id}">수정</button><button data-del="${q.id}">삭제</button></div>`).join("");$("adminList").querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{let q=data.find(z=>z.id===+b.dataset.edit);$("editId").value=q.id;$("qText").value=q.question;$("qAnswer").value=String(q.answer);$("qExpl").value=q.explanation;$("pub").checked=q.published});$("adminList").querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("삭제할까요?")){let r=await sb.from("questions").delete().eq("id",+b.dataset.del);if(r.error)alert(r.error.message);else{await loadQs();await adminLoad()}}})}
init();
</script></body></html>
